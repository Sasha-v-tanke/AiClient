version: '3.8'

services:
  mongodb:
    image: mongo:latest
    container_name: courier-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  server:
    build: ./server
    container_name: courier-server
    ports:
      - "5000:5000"
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/courier_messenger
      - PORT=5000
      - JWT_SECRET=your_jwt_secret_key_here
    depends_on:
      - mongodb

  web-client:
    build: ./web-client
    container_name: courier-web
    ports:
      - "3000:3000"
    environment:
      - WDS_SOCKET_PORT=0
    depends_on:
      - server
    stdin_open: true
    tty: true

volumes:
  mongodb_data:
